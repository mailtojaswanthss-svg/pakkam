<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyanGlow" cx="10%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#42DDEB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#42DDEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42DDEB"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gnaniGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#42DDEB" flood-opacity="0.2"/>
    </filter>
    <filter id="scamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;family=Noto+Sans+Tamil:wght@700;800&amp;family=JetBrains+Mono:wght@700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .tamil { font-family: 'Noto Sans Tamil', sans-serif; }
  </style>

  <!-- 1. Background Fill -->
  <rect width="1920" height="1080" fill="#060913"/>
  
  <!-- 2. Ambient Auras -->
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#purpleGlow)"/>
  <rect width="1920" height="1080" fill="url(#emeraldGlow)"/>

  <!-- 3. Top Header Bar -->
  <g transform="translate(90, 70)">
    <!-- Logo -->
    <rect width="60" height="60" rx="18" fill="url(#logoGrad)"/>
    <path d="M40 18H20c-1.1 0-2 .9-2 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V20c0-1.1-.9-2-2-2zm-5 14H24v-2h11v2zm3-4H24v-2h14v2zm0-4H24V22h14v2z" fill="#FFFFFF"/>
    
    <!-- App Title -->
    <text x="80" y="42" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Pakkam</text>
    <text x="228" y="42" class="tamil" font-size="30" font-weight="700" fill="#42DDEB">பக்கம்</text>

    <!-- Challenge Pill -->
    <g transform="translate(1180, 5)">
      <rect width="560" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
      <text x="30" y="32" font-size="16" font-weight="600" fill="#94A3B8">Built for <tspan fill="#F8FAFC" font-weight="700">Great Indian AI Internship Challenge</tspan></text>
      <rect x="420" y="10" width="120" height="30" rx="6" fill="url(#gnaniGrad)"/>
      <text x="480" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">BY GNANI.AI</text>
    </g>
  </g>

  <!-- 4. Left Hero Column -->
  <g transform="translate(90, 230)">
    <!-- Zero Hallucination Pill -->
    <g>
      <rect width="240" height="38" rx="19" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="24" cy="19" r="5" fill="#EF4444"/>
      <text x="38" y="24" font-size="15" font-weight="700" fill="#F87171" letter-spacing="0.05em">ZERO HALLUCINATION AI</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="115" font-size="64" font-weight="900" fill="#FFFFFF" line-height="1.1" letter-spacing="-0.035em">
      My AI <tspan fill="#F87171" text-decoration="underline">refused</tspan> 39 out of 40 questions.
    </text>
    <text x="0" y="185" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.035em">
      That was the goal.
    </text>

    <!-- Subhead description -->
    <text x="0" y="270" font-size="22" font-weight="500" fill="#94A3B8" line-height="1.5">
      When someone's <tspan fill="#F1F5F9" font-weight="700">₹1,000 monthly support</tspan> is on the line, confident wrong answers ruin lives.
    </text>
    <text x="0" y="305" font-size="22" font-weight="500" fill="#94A3B8" line-height="1.5">
      Pakkam cites the <tspan fill="#F1F5F9" font-weight="700">official government order, page, and exact line</tspan>. No page, no answer.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 370)">
      <!-- Metric 1: Refused -->
      <g>
        <rect width="240" height="110" rx="20" fill="#0F172A" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
        <text x="24" y="52" class="mono" font-size="34" font-weight="800" fill="#F87171">39 / 40</text>
        <text x="24" y="85" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="0.05em">UNVERIFIED REFUSED</text>
      </g>
      <!-- Metric 2: 98% Page Accuracy -->
      <g transform="translate(260, 0)">
        <rect width="240" height="110" rx="20" fill="#0F172A" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
        <text x="24" y="52" class="mono" font-size="34" font-weight="800" fill="#10B981">98%</text>
        <text x="24" y="85" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="0.05em">EXACT PAGE CITATION</text>
      </g>
      <!-- Metric 3: Voice AI -->
      <g transform="translate(520, 0)">
        <rect width="270" height="110" rx="20" fill="#0F172A" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
        <text x="24" y="52" font-size="28" font-weight="800" fill="#42DDEB">Tamil · Voice</text>
        <text x="24" y="85" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="0.05em">GNANI PRISMA &amp; TIMBRE</text>
      </g>
    </g>
  </g>

  <!-- 5. Right Column: Proof Card Mockup (Figma Frame Component) -->
  <g transform="translate(1220, 210)">
    <!-- Angled Scam WhatsApp Card (Background) -->
    <g transform="translate(-25, -25) rotate(-3)" filter="url(#scamShadow)">
      <rect width="570" height="160" rx="22" fill="#141C2E" stroke="#EF4444" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="24" y="20" width="170" height="26" rx="6" fill="#EF4444" fill-opacity="0.25"/>
      <text x="34" y="38" font-size="12" font-weight="800" fill="#FCA5A5">⚠️ FAKE FORWARD FLAGGED</text>
      <text x="24" y="80" font-size="15" fill="#94A3B8" text-decoration="line-through">
        "Magalir Urimai increased to Rs.2,000! Share OTP to claim..."
      </text>
    </g>

    <!-- Hero Glassmorphic Proof Card (Foreground) -->
    <g filter="url(#cardShadow)">
      <rect width="580" height="520" rx="30" fill="url(#cardGrad)" stroke="#42DDEB" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- Card Header -->
      <g transform="translate(36, 36)">
        <!-- Verified Badge -->
        <rect width="165" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
        <path d="M22 18l4 4 8-8" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="23" font-size="13" font-weight="800" fill="#10B981" letter-spacing="0.06em">VERIFIED PROOF</text>

        <!-- Document Reference -->
        <text x="508" y="24" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#42DDEB">G.O.(Ms) No. 15</text>
        <line x1="0" y1="52" x2="508" y2="52" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      </g>

      <!-- Question Bubble -->
      <g transform="translate(36, 120)">
        <rect width="508" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
        <circle cx="36" cy="33" r="18" fill="#42DDEB" fill-opacity="0.15"/>
        <path d="M36 24v12M30 30h12" stroke="#42DDEB" stroke-width="2" stroke-linecap="round"/>
        <text x="68" y="39" font-size="18" font-weight="600" fill="#E2E8F0">"Magalir urimai ku income limit evlo?"</text>
      </g>

      <!-- Highlighted Gazette Citation Box -->
      <g transform="translate(36, 215)">
        <rect width="508" height="160" rx="16" fill="#090E1A" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
        <rect width="5" height="160" rx="2" fill="#F59E0B"/>
        
        <!-- Metadata -->
        <text x="24" y="34" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="0.06em">OFFICIAL GAZETTE ORDER</text>
        <rect x="375" y="18" width="110" height="24" rx="6" fill="#F59E0B" fill-opacity="0.18"/>
        <text x="430" y="35" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#FBBF24">PAGE 10 · SEC 3</text>

        <!-- Highlighted Tamil line -->
        <rect x="20" y="58" width="468" height="80" rx="8" fill="#F59E0B" fill-opacity="0.25"/>
        <text x="32" y="92" class="tamil" font-size="20" font-weight="700" fill="#FFFFFF">
          குடும்பத்தின் ஆண்டு வருமானம்
        </text>
        <text x="32" y="122" class="tamil" font-size="20" font-weight="700" fill="#FFFFFF">
          ரூ.2.5 இலட்சத்திற்குக் கீழ் இருக்க வேண்டும்.
        </text>
      </g>

      <!-- Proof Footer -->
      <g transform="translate(36, 420)">
        <line x1="0" y1="0" x2="508" y2="0" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
        <text x="0" y="40" font-size="15" font-weight="600" fill="#94A3B8">Show at any government counter</text>
        <text x="508" y="40" text-anchor="end" font-size="15" font-weight="700" fill="#10B981">✓ Evidence First</text>
      </g>
    </g>
  </g>

  <!-- 6. Bottom Tagline Bar -->
  <g transform="translate(90, 990)">
    <line x1="0" y1="0" x2="1740" y2="0" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    
    <text x="0" y="45" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="0.02em">
      No page, no answer. <tspan class="tamil" font-size="22" font-weight="700" fill="#42DDEB">பதில் மட்டும் இல்ல, பக்கமும்.</tspan>
    </text>

    <g transform="translate(1420, 15)">
      <rect width="320" height="46" rx="12" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1"/>
      <text x="160" y="30" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#C084FC">pakkam-alpha.vercel.app</text>
    </g>
  </g>
</svg>
