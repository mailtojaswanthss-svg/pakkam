[project]
name = "indic-scheme-rag"
version = "0.1.0"
description = "Citation-grounded RAG assistant for public Indian government schemes in Tamil, Hindi, English and Tanglish."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Each pipeline stage pulls in only what it needs, so CI and the API image stay small.
ingest = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
index = [
    "FlagEmbedding>=1.2",
    "qdrant-client>=1.10",
    "indic-transliteration>=2.3",
]
generate = [
    "anthropic>=0.40",
    "transformers>=4.44",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
eval = [
    "pandas>=2.2",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Third-party libraries without type information.
[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true

# pymupdf ships no type hints for its constructors, so allow calling it from these modules.
[[tool.mypy.overrides]]
module = ["schemebot.ingest.extract", "tests.*"]
disallow_untyped_calls = false
