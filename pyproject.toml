[project]
name = "indic-scheme-rag"
version = "0.1.0"
description = "Citation-grounded RAG assistant for public Indian government schemes in Tamil, Hindi, English and Tanglish."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Each pipeline stage pulls in only what it needs, so CI and the API image stay small.
ingest = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
index = [
    "torch>=2.6",
    "FlagEmbedding>=1.3",
    "qdrant-client>=1.12",
]
# The vector store alone: lets CI run the retrieval tests without PyTorch.
store = [
    "qdrant-client>=1.12",
]
generate = [
    "anthropic>=0.75",
]
# Alternative answer provider (SCHEMEBOT_LLM_PROVIDER=gemini).
gemini = [
    "google-genai>=2.30",
]
api = [
    "fastapi[standard]>=0.115",
]
eval = [
    "pandas>=2.2",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemebot"]

[tool.fastapi]
entrypoint = "schemebot.api.main:app"

# CUDA build of PyTorch on Windows/Linux (PyPI only has the CPU build for Windows).
# macOS has no CUDA, so it falls back to the default PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests marked `models` download and run the real bge-m3 / reranker models (~4 GB, GPU
# recommended). They are skipped by default; run them with `pytest -m models`.
markers = ["models: needs the real embedding and reranker models (slow)"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Third-party libraries without type information, or not installed in CI (torch, transformers).
[[tool.mypy.overrides]]
module = ["pytesseract", "FlagEmbedding", "huggingface_hub", "torch", "torch.*", "transformers", "transformers.*", "anthropic", "anthropic.*", "google", "google.*", "pymupdf"]
ignore_missing_imports = true

# pymupdf ships no type hints for its constructors, so allow calling it from these modules.
[[tool.mypy.overrides]]
module = ["schemebot.ingest.extract", "tests.*"]
disallow_untyped_calls = false
