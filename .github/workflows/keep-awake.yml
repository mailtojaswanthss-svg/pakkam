# Keeps the backup answer server on Hugging Face Spaces awake: a free Space sleeps after
# about two days without visits. /health is cheap (no LLM call, no model run).
name: Keep the backup Space awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping /health (waits for a cold start)
        run: curl -fsS --retry 5 --retry-delay 60 --retry-all-errors --max-time 120 https://jazz716-pakkam.hf.space/health
