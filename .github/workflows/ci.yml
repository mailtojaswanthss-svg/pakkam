name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      # Everything except PyTorch and the embedding library: the fast tests use fake models.
      - name: Install dependencies
        run: >-
          uv sync --frozen --extra ingest --extra store --extra generate --extra gemini
          --extra api --extra eval

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      # Tests marked `models` need the real models (about 4.5 GB) and are skipped here.
      - name: Tests
        run: uv run pytest -q

  image:
    name: Docker image builds
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The CUDA build of PyTorch needs more disk than a fresh runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pakkam:ci
