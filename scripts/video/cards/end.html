<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap');
html,body{margin:0;width:1536px;height:864px;overflow:hidden;background:#070A17 url(https://pakkam-alpha.vercel.app/assets/art/aurora.webp) center/cover;font-family:Inter,sans-serif;color:#F5F3FF;text-align:center}
.orb{width:190px;height:190px;margin:92px auto 0;display:block;filter:drop-shadow(0 0 40px #a855f799);opacity:0;animation:pop .9s cubic-bezier(.22,1,.36,1) .1s forwards}
.brand{font:800 26px 'Plus Jakarta Sans';letter-spacing:.18em;color:#42DDEB;margin-top:26px;opacity:0;animation:in .7s .5s forwards}
h1{font:800 76px/1.05 'Plus Jakarta Sans';letter-spacing:-.025em;margin:16px 0 0;opacity:0;animation:in .7s .8s forwards}
h1 span{background:linear-gradient(100deg,#A855F7,#42DDEB);-webkit-background-clip:text;color:transparent}
.url{font:700 30px 'Plus Jakarta Sans';margin-top:26px;color:#F5F3FF;opacity:0;animation:in .7s 1.3s forwards}
.team{display:flex;justify-content:center;gap:34px;margin-top:34px;opacity:0;animation:in .7s 1.7s forwards}
.p{display:flex;align-items:center;gap:12px;font:600 22px Inter}
.p img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #a855f7}
.foot{position:absolute;bottom:34px;left:0;right:0;font-size:19px;color:#B5BED2;opacity:0;animation:in .7s 2.1s forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
</style></head><body>
<img class="orb" src="https://pakkam-alpha.vercel.app/assets/images/dark-orb.webp">
<div class="brand">PAKKAM · பக்கம்</div>
<h1>Speak. Hear. <span>See the proof.</span></h1>
<div class="url">pakkam-alpha.vercel.app</div>
<div class="team"><div class="p"><img src="https://pakkam-alpha.vercel.app/assets/team/jaswanth.jpg">Jaswanth S S</div><div class="p"><img src="https://pakkam-alpha.vercel.app/assets/team/mohit.jpg">Mohit K</div></div>
<div class="foot">Voice by Gnani Prisma &amp; Timbre · #GreatIndianAIInternshipChallenge · #GnaniAI</div>
</body></html>
