<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap');
html,body{margin:0;width:1536px;height:864px;overflow:hidden;background:#070A17 url(https://pakkam-alpha.vercel.app/assets/art/aurora.webp) center/cover;font-family:Inter,sans-serif;color:#F5F3FF}
.wrap{position:absolute;inset:0;display:grid;place-items:center}
.phone{width:520px;padding:26px 24px 30px;border-radius:36px;background:#0d1426ee;border:1px solid #ffffff22;box-shadow:0 30px 80px #0009;opacity:0;transform:translateY(40px) scale(.96);animation:in .8s cubic-bezier(.22,1,.36,1) .2s forwards}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:#B5BED2;font-size:17px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#475569,#334155)}
.bubble{background:#12352b;border:1px solid #25d36655;border-radius:22px 22px 22px 6px;padding:18px 20px 16px;font-size:25px;line-height:1.45;opacity:0;animation:in .7s cubic-bezier(.22,1,.36,1) .9s forwards}
.fw{font-size:15px;color:#4ade80;font-style:italic;margin-bottom:8px}
mark{background:none;color:inherit;border-radius:6px;padding:0 3px;transition:background .4s}
.on1 mark.a{background:#dc262666}.on2 mark.b{background:#f59e0b66}
.time{text-align:right;font-size:13px;color:#8F9AB3;margin-top:6px}
.q{position:absolute;bottom:92px;left:0;right:0;text-align:center;font:800 64px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;opacity:0;animation:in .7s cubic-bezier(.22,1,.36,1) 3.6s forwards}
.q span{background:linear-gradient(100deg,#A855F7,#42DDEB);-webkit-background-clip:text;color:transparent}
@keyframes in{to{opacity:1;transform:none}}
</style></head><body><div class="wrap"><div class="phone" id="p">
<div class="top"><span class="av"></span><b style="color:#F5F3FF">Family group</b> · 214 members</div>
<div class="bubble"><div class="fw">↪ Forwarded many times</div>
Magalir Urimai increased to <mark class="a">Rs.2,000 a month</mark>! Register at <mark class="b">bit.ly/kmut2000</mark> <mark class="b">today only</mark> and <mark class="b">share OTP</mark> to confirm.
<div class="time">9:41 AM</div></div></div></div>
<div class="q">Is it <span>true?</span></div>
<script>setTimeout(()=>document.getElementById('p').classList.add('on1'),2000);setTimeout(()=>document.getElementById('p').classList.add('on2'),2700);</script>
</body></html>
